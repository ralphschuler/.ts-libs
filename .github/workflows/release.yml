name: Publish a reviewed package
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace name, for example @ralphschuler/assert"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: package-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable --immutable-cache
      - run: yarn check
      - name: Publish the explicitly selected workspace
        run: yarn workspace "$PACKAGE_NAME" npm publish
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
