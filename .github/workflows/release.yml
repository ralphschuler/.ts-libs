name: Publish a reviewed package
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace name, for example @ralphschuler/assert"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: package-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable --immutable-cache
      - run: yarn check
      - name: Publish the explicitly selected workspace
        run: yarn workspace "$PACKAGE_NAME" npm publish
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
