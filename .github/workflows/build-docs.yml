name: Build and deploy concept documentation

on:
  pull_request:
    paths:
      - "documentation/**"
      - ".github/scripts/build-documentation.mjs"
      - ".github/scripts/validate-documentation.mjs"
      - ".github/workflows/build-docs.yml"
      - "package.json"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "documentation/**"
      - ".github/scripts/build-documentation.mjs"
      - ".github/scripts/validate-documentation.mjs"
      - ".github/workflows/build-docs.yml"
      - "package.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build static documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate documentation
        run: node .github/scripts/build-documentation.mjs
      - name: Validate content and links
        run: node .github/scripts/validate-documentation.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    name: Deploy static documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
