name: Validate repository
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pinned package-manager launcher
        run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable --immutable-cache
      - name: Audit all workspace and transitive dependencies
        run: yarn security:check
      - name: Lint, build, real tests, package imports, examples, and documentation
        run: yarn check
      - name: Check both languages in desktop and mobile browsers
        run: yarn docs:browser
        env:
          CHROME_PATH: google-chrome
      - name: Build optional HTML and Markdown API references
        run: yarn docs:all
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-browser
          path: .artifacts/browser/
          if-no-files-found: ignore
