name: Validate repository
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned package-manager launcher
        run: npm install --global corepack@0.34.0
      - run: corepack enable
      - run: yarn install --immutable --immutable-cache
      - name: Lint, build, real tests, package imports, examples, and documentation
        run: yarn check
      - name: Check both languages in desktop and mobile browsers
        run: yarn docs:browser
        env:
          CHROME_PATH: google-chrome
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-browser
          path: .artifacts/browser/
          if-no-files-found: ignore
