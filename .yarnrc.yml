compressionLevel: mixed

enableGlobalCache: false

nodeLinker: pnp

# The upstream loader omits these runtime requirements under strict PnP.
packageExtensions:
  "@commitlint/load@*":
    dependencies:
      "@types/node": "^24.0.0"
      typescript: "^5.9.3"

npmRegistries:
  //npm.pkg.github.com/:
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN-}"

npmScopes:
  ralphschuler:
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN-}"
    npmPublishRegistry: "https://npm.pkg.github.com"
    npmRegistryServer: "https://npm.pkg.github.com"

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - linux
    - darwin
    - windows
